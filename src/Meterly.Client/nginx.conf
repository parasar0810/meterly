# =============================================================
# Nginx configuration for Blazor WebAssembly (SPA)
#
# Key responsibilities:
#   1. Serve static files from /usr/share/nginx/html
#   2. Return correct MIME types for .wasm and Blazor DLLs
#   3. SPA fallback: any unknown route returns index.html so
#      Blazor's client-side router handles it (no 404 on refresh)
#   4. Enable gzip compression for faster transfer
# =============================================================

events { }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── MIME type overrides for Blazor WASM ────────────────────────────────────
    # Blazor WebAssembly ships .wasm binaries and (in older builds) .dll files.
    # Browsers reject wasm files that aren't served with the correct MIME type.
    types {
        application/wasm   wasm;
        application/octet-stream dll;
    }

    # ── Gzip compression ────────────────────────────────────────────────────────
    gzip on;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/wasm
        application/octet-stream;
    gzip_min_length 1024;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # ── SPA fallback ─────────────────────────────────────────────────────────
        # All requests that don't match a real file are redirected to index.html.
        # This lets Blazor's router interpret the URL on the client side.
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ── Cache static assets aggressively ─────────────────────────────────────
        # Blazor publishes hashed filenames so it's safe to cache them for a year.
        location ~* \.(js|css|wasm|dll|ico|png|svg|woff2?)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
